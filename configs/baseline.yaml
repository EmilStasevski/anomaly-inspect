family: baseline
seed: 42
data:
  root: data/mvtec_ad
  calibration_fraction: 0.1
  batch_size: 32
  num_workers: 8
preprocess:
  resize: 256
  crop: 224
model:
  backbone: resnet18
  layers: [layer1, layer2, layer3]
  feature_dims: 100
  covariance_epsilon: 0.01
  sigma: 4
threshold:
  sigmas: 3.0
