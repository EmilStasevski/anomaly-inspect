services:
  inference:
    build: serving
    image: anomaly-inspect/inference:local
    environment:
      INTRA_THREADS: "4"
    volumes:
      - ./models/onnx:/models:ro
    ports:
      - "127.0.0.1:${INFERENCE_PORT:-8090}:8080"
    read_only: true
    # The image also runs as a non-root user. no-new-privileges is not set because snap-packaged
    # Docker then refuses to exec the entrypoint under its AppArmor profile.
    cap_drop: [ALL]
    restart: unless-stopped

  mlflow:
    build: docker/mlflow
    image: anomaly-inspect/mlflow:local
    user: "${MLFLOW_UID:-1000}:${MLFLOW_GID:-1000}"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination=/mlruns
      - --serve-artifacts
      # Only published on the loopback interface, see `ports`.
      - --allowed-hosts=127.0.0.1:5000,localhost:5000,mlflow:5000
    environment:
      HOME: /tmp
    volumes:
      - ./mlflow-data:/mlflow-data
      - ./mlruns:/mlruns
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
