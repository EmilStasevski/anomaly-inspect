[project]
name = "anomaly-inspect"
version = "0.1.0"
description = "Unsupervised visual quality inspection: PaDiM-style baseline vs PatchCore, ONNX export, Rust serving."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anomalib==2.7.*",
    "matplotlib>=3.9",
    "mlflow>=3.17,<4",
    "numpy>=2.0",
    "onnx>=1.23",
    "onnxruntime>=1.31",
    "onnxscript>=0.5",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "scikit-image>=0.25",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "timm>=1.0",
    "torch==2.11.*",
    "torchvision>=0.26",
]

[dependency-groups]
dev = [
    "dvc>=3.60",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_inspect"]

# Blackwell (compute capability 12.0) needs wheels built against CUDA 12.8+.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a CUDA GPU",
    "data: requires the MVTec AD dataset under ./data/mvtec_ad",
    "model: requires exported model artifacts under ./models",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
